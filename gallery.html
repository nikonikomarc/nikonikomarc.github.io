<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Under My Skin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-page">

  <main class="gallery-container">

    <!-- ヘッダーエリア -->
    <header class="gallery-header">
      <div class="header-index">
        <span class="num">01</span>
        <span class="label">WORKS</span>
      </div>
      <div class="header-title">
        <h1>GRALLEY</h1>
        <p class="subtitle">GALLERY / WORKS  <span class="arrow">↘</span></p>
      </div>
    </header>

    <!-- 4列の作品グリッド -->
    <div class="gallery-grid">

      <!-- 作品カード 1 -->
      <article class="gallery-item">
        <div class="item-meta">
          <span class="item-id">ID_ART_01</span>
          <span class="item-tag">POSTER</span>
        </div>
        <!-- 画像のみリンク化（パス: img/player.png） -->
        <a href="work01.html" class="img-frame">
          <img src="おくすり.png" alt="Work 01" class="work-img">
        </a>
        <div class="item-info">
          <h2>INSIDE OUT</h2>
          <span class="icon-arrow">→</span>
        </div>
      </article>

    </div>

  </main>

</body>
</html>
