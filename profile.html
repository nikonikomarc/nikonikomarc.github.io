<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="profile-page">

  <main class="poster-container">
    
    <!-- コーナー記号 -->
    <div class="corner top-left">┌</div>
    <div class="corner top-right">┐</div>
    <div class="corner bottom-left">└</div>
    <div class="corner bottom-right">┘</div>

    <!-- 中央の巨大タイポグラフィ -->
    <div class="hero-text">
      <span class="w1">WHO</span>
      <span class="w2">AM</span>
      <span class="w3">I?</span>
    </div>

    <!-- 四隅・周辺のメタ情報 -->
    <div class="tag age">
      <span class="label">AGE</span>
      <span class="val">20</span>
    </div>

    <div class="tag mbti">
      <span class="label">MBTI</span>
      <span class="val">INFP</span>
    </div>

    <div class="tag location">
      <span class="label">LOCATION</span>
      <span class="val">TOCHIGI</span>
    </div>

    <div class="tag status">
      <span class="label">STATUS</span>
      <span class="val">DESIGN STUDENT</span>
    </div>

    <div class="tag instagram">
      <span class="label">IG</span>
      <span class="val">@YUA_XXX</span>
    </div>

  </main>

</body>
</html>
